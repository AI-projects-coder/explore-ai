[project]
name = "hr-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AI-projects-coder", email = "manikantakondapalli9498@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.146.0",
    "google-genai>=2.31.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.5",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hr-assistant = "hr_assistant.cli:main"

[project.optional-dependencies]
ingest = [
    "docling>=2.140.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "docling>=2.140.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


# On Linux (Cloud Run), take torch from PyTorch's CPU-only index: the default Linux wheels bundle CUDA,
# gigabytes of GPU libraries that are useless on CPU-only machines. macOS keeps the normal wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
