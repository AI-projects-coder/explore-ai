    # Reviewed after a run: the model wrote "no annual increment", which the first version of this
    # list missed (the judge caught the disagreement). Keep alternatives broad for free-text wording.
    must_contain: ["60|sixty", "no increment|no annual increment|not receive|not eligible|0%|no salary increase|none"]
    depends_on: [Performance Review Guide for Managers, Salary Bands 2026]
    source: hand_written

