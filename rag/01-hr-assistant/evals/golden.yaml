  - id: combine-cl-el
    category: trap
    tier: quality
    user: intern_ravi
    question: Can I take casual leave and earned leave together for one trip?
    expected_outcome: answered
    expected_sections: ["3.1 Casual Leave"]
    must_contain: ["no|not|cannot"]
    depends_on: [Leave Policy 2026]
