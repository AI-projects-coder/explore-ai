  - id: hometown-not-abroad
    category: trap
    tier: quality
    user: intern_ravi
    question: Can I work from my hometown in Kerala for three weeks?
    expected_outcome: answered
    expected_sections: ["8. Working From Another City"]
    # The third fact makes the known issue a DETERMINISTIC check: the LLM judge flip-flopped on this
    # borderline claim, so the exact requirement ("depends on days already used") is checked by text.
    must_contain: ["30|thirty", "approval|approve", "already used|remaining|left this year|balance|not used"]
    # Reviewed: no must_not_contain. Sections 8 and 9 share a chunk, so a correct answer may add
    # "working outside India is not permitted" as context. A wrong "no" answer misses "30" anyway.
    # KNOWN LIMITATION (2026-10-19): answers state the 30-day limit and approval, but still conclude
    # "three weeks is permitted" without saying it depends on days already used this year. Prompt rule 5
    # improved this (from "it's covered" to conditional answers); left failing on purpose so it stays visible.
    known_issue: true
    depends_on: [Work From Home Policy]
    source: hand_written

