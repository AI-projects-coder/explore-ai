# Golden dataset for the HR assistant: what SHOULD happen, decided by a human.
#
# Fields
#   id                  unique, stable name (results are compared across runs by id)
#   category            simple | table | trap | multi_part | paraphrase | access | not_found | off_topic | adversarial
#   tier                must_pass (any failure blocks a release) | quality (tracked as a score)
#   user                a dev user from core/auth.py DEV_USERS (decides the groups)
#   question            exactly what the user types
#   expected_outcome    answered | not_found | off_topic, or a list of acceptable outcomes
#   expected_sections   the answer lives here: each entry must appear in a retrieved chunk's heading path or
#                       headings; "a|b" inside one entry means either section is enough
#   must_contain        facts the answer must state; "a|b" means either a or b (case-insensitive, commas ignored,
#                       numbers matched as whole numbers so "14" never counts as "4")
#   must_not_contain    tempting WRONG facts or leaked text the answer must never contain
#   forbidden_documents document titles this user must never retrieve (access control)
#   depends_on          documents whose content the expected answer comes from (review the case when they change)
#   source              hand_written | production_report | policy_change
#
# Facts verified against data/sample_docs (v1 of the leave policy). Reviewed by: <your name>, <date>

cases:
  # ---------------------------------------------------------------- simple facts: one fact, one section
  - id: cl-carry-forward
    category: simple
    tier: must_pass
    user: intern_ravi
    question: How many casual leaves can I carry forward?
    expected_outcome: answered
    # "a|b" = either is fine: the fact is in section 3.1 AND in the entitlements table chunk
    expected_sections: ["3.1 Casual Leave|3. Leave Entitlements"]
    must_contain: ["4|four"]  # numbers are matched as whole words: "14" does not count as "4"
    # 30 is EARNED leave carry forward: the classic near-miss. Reviewed: a correct answer could
    # mention it as a comparison, but that is noise worth flagging, so we keep it forbidden.
    must_not_contain: ["30"]
    depends_on: [Leave Policy 2026]
    source: hand_written

